<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>역류 :: 기업 게시판</title>
<style>
:root {
  /* Layout: 2000s-style forum. Board header, thread list, open thread with live replies. Single dark theme. */
  --bg: #121417;
  --panel: #1a1d21;
  --row: #1f2328;
  --line: #2c3138;
  --text: #c9ccd1;
  --dim: #7b828c;
  --amber: #d9a441;
  --red: #b5483b;
  --mono: "D2Coding", "Consolas", "SFMono-Regular", "Menlo", monospace;
  --body: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 14px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
a { color: var(--amber); }
button { font: inherit; }
:focus-visible { outline: 1px dashed var(--amber); outline-offset: 2px; }

.addr { font-family: var(--mono); font-size: 12px; color: var(--dim); padding: 8px 0; border-bottom: 1px solid var(--line); }
.addr .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.addr b { color: #5e8f6b; font-weight: normal; }

header.top { padding: 18px 0 10px; }
.logo { font-family: var(--mono); font-size: 26px; letter-spacing: .08em; color: var(--amber); }
.logo small { font-size: 12px; color: var(--dim); letter-spacing: 0; margin-left: 10px; }
.crumbs { font-size: 12px; color: var(--dim); margin-top: 4px; }

.box { background: var(--panel); border: 1px solid var(--line); margin-bottom: 18px; }
.box > h2 { margin: 0; font-size: 13px; font-weight: normal; color: var(--dim); padding: 8px 12px; border-bottom: 1px solid var(--line); font-family: var(--mono); }

table.list { width: 100%; border-collapse: collapse; font-size: 13px; }
.list td { padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.list tr:last-child td { border-bottom: none; }
.list td.n { width: 64px; color: var(--dim); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.list td.w { width: 110px; color: var(--dim); }
.list td.t { width: 64px; white-space: nowrap; text-align: right; color: var(--dim); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.list .new { color: var(--amber); font-family: var(--mono); font-size: 11px; margin-right: 6px; }
.list tr.hot td { background: var(--row); }
.list .ttl { color: var(--text); }
@media (max-width: 560px) { .list td.w { display: none; } }

.post { padding: 16px; }
.post h1 { font-size: 18px; margin: 0 0 8px; font-weight: 600; color: #e4e6ea; }
.meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--dim); border-bottom: 1px dashed var(--line); padding-bottom: 10px; margin-bottom: 14px; font-family: var(--mono); }
.who { background: none; border: none; padding: 0; color: var(--amber); cursor: pointer; font-family: var(--mono); font-size: 12px; text-decoration: underline dotted; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #5e8f6b; margin-right: 4px; vertical-align: 1px; }
.dot.off { background: #555; }
.body p { margin: 0 0 10px; }
.photo { margin: 6px 0 14px; display: grid; gap: 8px; }
.photo canvas { width: 100%; max-width: 520px; height: auto; display: block; border: 1px solid var(--line); background: #0b0c0e; }
.photo .cap { font-size: 11px; color: var(--dim); font-family: var(--mono); }
.sig { margin-top: 14px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--dim); }

.profile { display: none; margin: 0 0 14px; padding: 12px; background: var(--row); border: 1px solid var(--line); font-size: 12px; }
.profile.open { display: block; }
.profile dl { display: grid; grid-template-columns: 90px 1fr; gap: 2px 10px; margin: 0 0 10px; font-family: var(--mono); }
.profile dt { color: var(--dim); }
.profile dd { margin: 0; }
.profile ul { margin: 0; padding-left: 16px; }
.profile li span { color: var(--dim); font-family: var(--mono); margin-left: 6px; }

.replies { border-top: 1px solid var(--line); }
.reply { padding: 10px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
.reply:last-child { border-bottom: none; }
.reply .rh { font-size: 12px; color: var(--dim); font-family: var(--mono); display: flex; gap: 10px; }
.reply .rh b { color: var(--text); font-weight: normal; }
.reply.op .rh b { color: var(--amber); }
.reply.op .rh b::after { content: " [글쓴이]"; color: var(--dim); }
.reply.fresh { animation: in .6s ease; }
@keyframes in { from { background: #2a2a20; } to { background: transparent; } }
.noreply { padding: 10px 16px; color: var(--dim); font-size: 12px; }

.write { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
.write input { flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--dim); padding: 6px 8px; font: inherit; font-size: 13px; }
.write button { background: var(--row); border: 1px solid var(--line); color: var(--dim); padding: 6px 12px; cursor: not-allowed; }

.gone { padding: 48px 16px; text-align: center; color: var(--dim); font-family: var(--mono); }
.gone b { display: block; color: var(--text); font-size: 15px; margin-bottom: 6px; font-weight: normal; }

.glitch { animation: gl .9s steps(2) 1; }
@keyframes gl {
  0% { filter: none; transform: none; }
  20% { filter: invert(1) hue-rotate(90deg); transform: translateX(3px); }
  40% { filter: none; transform: translateX(-4px) skewX(4deg); opacity: .6; }
  60% { filter: contrast(3) brightness(.4); transform: none; }
  80% { opacity: .2; }
  100% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) { .glitch, .reply.fresh { animation: none; } }

footer { color: #4b5058; font-size: 11px; font-family: var(--mono); padding: 10px 0 30px; text-align: center; }
</style>
</head>
<body>

<div class="addr"><div class="wrap"><span><b>●</b> yeokryu4kx2qv7mz3hd9tqp2c5nnl0fwa8e6s.onion/board/corp</span><span id="clock">--:--:--</span></div></div>

<div class="wrap">
  <header class="top">
    <div class="logo">逆流 <small>역류 · 익명 기업 정보 게시판</small></div>
    <div class="crumbs">홈 › 기업 › 테크 계열 &nbsp;|&nbsp; 접속 중 <span id="online">214</span>명</div>
  </header>

  <div class="box">
    <h2>/corp/tech · 최신 글</h2>
    <table class="list">
      <tbody id="list"></tbody>
    </table>
  </div>

  <div class="box" id="thread"></div>

  <footer>이 게시판의 글은 작성자 본인만 삭제할 수 있습니다.</footer>
</div>

<script>
(function () {
  // ---- KP 설정 ----
  // 주소 끝에 #reset : 타이머 초기화 (다시 처음부터)
  // 주소 끝에 #fast  : 10배속 (테스트용, 6초 만에 삭제)
  var DURATION = 60; // 삭제까지 걸리는 시간(초)
  var KEY = "yeokryu-thread-48213";
  var speed = location.hash === "#fast" ? 10 : 1;

  function store(fn) { try { return fn(window.localStorage); } catch (e) { return null; } }
  if (location.hash === "#reset" || location.hash === "#fast") {
    store(function (s) { s.removeItem(KEY); });
  }
  var start = Number(store(function (s) { return s.getItem(KEY); })) || 0;
  if (!start) { start = Date.now(); store(function (s) { s.setItem(KEY, String(start)); }); }

  function elapsed() { return (Date.now() - start) / 1000 * speed; }
  function at(sec) { return new Date(start + sec * 1000 / speed); }
  function hm(d) { return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  function hms(d) { return hm(d) + ":" + String(d.getSeconds()).padStart(2, "0"); }

  // ---- 게시판 목록 (평범한 글) ----
  var others = [
    { n: 48209, t: "알레테이아 API 요금 또 오름. 대체재 있냐", w: "0xDEAD", ago: 41 },
    { n: 48204, t: "QS 신입 공채 면접 후기 (NDA 때문에 반만 씀)", w: "고양이발", ago: 77 },
    { n: 48197, t: "모놀리스 해외 현장 파견 일당 얼마 받음?", w: "막차", ago: 128 },
    { n: 48191, t: "에테르 런웨이 초대장 되팔이 조심하셈", w: "무명", ago: 203 },
    { n: 48186, t: "이그니스 신차 대기 3년이라는데 실화냐", w: "ㅇㅇ", ago: 260 }
  ];

  // ---- 댓글 타임라인 (초) ----
  var replies = [
    { t: 6,  w: "ㅇㅇ", m: "ㄹㅇ? 어디서" },
    { t: 14,  w: "등대지기", op: true, m: "판교. 테크노밸리 안쪽 길. 검은 차 세 대에서 내림" },
    { t: 21, w: "고양이발", m: "키네틱 사람이 판교를 왜 감. 걔네 화성이잖아" },
    { t: 28, w: "0xDEAD", m: "판교면 거기 누구 동네인지 다 알잖아 ㅋㅋ 원수 집 앞에서 뭐함" },
    { t: 36, w: "등대지기", op: true, m: "그러니까 이상하다는 거. QS랑 특허로 피 터지게 싸우는 중에 저기서 저 사람들이 나오는 게 말이 안 됨" },
    { t: 43, w: "막차", m: "사진 더 없음? 너무 흔들림" },
    { t: 50, w: "등대지기", op: true, m: "잠깐만" },
    { t: 56, w: "등대지기", op: true, m: "누가 문 두드림" }
  ];

  var list = document.getElementById("list");
  var thread = document.getElementById("thread");
  var deleted = false, shown = 0;

  function renderList() {
    var rows = "";
    if (!deleted) {
      rows += '<tr class="hot"><td class="n">48213</td><td><span class="new">NEW</span><span class="ttl">30분 전에 키네틱 에이펙스 간부진 봄</span> <span style="color:var(--dim)">[' + shown + ']</span></td><td class="w">등대지기</td><td class="t">' + hm(at(0)) + '</td></tr>';
    }
    others.forEach(function (o) {
      rows += '<tr><td class="n">' + o.n + '</td><td class="ttl">' + o.t + '</td><td class="w">' + o.w + '</td><td class="t">' + hm(new Date(start - o.ago * 60000)) + '</td></tr>';
    });
    list.innerHTML = rows;
  }

  function profileHTML() {
    var last = deleted ? hm(at(DURATION)) : "지금 접속 중";
    return '<dl>' +
      '<dt>가입</dt><dd>2019.03.14</dd>' +
      '<dt>게시글</dt><dd>' + (deleted ? "1,284" : "1,285") + '</dd>' +
      '<dt>평판</dt><dd>+2,917 (상위 1%)</dd>' +
      '<dt>마지막 활동</dt><dd>' + (deleted ? '<span class="dot off"></span>' : '<span class="dot"></span>') + last + '</dd>' +
      '</dl><div style="color:var(--dim);margin-bottom:4px">최근 작성 글</div><ul>' +
      (deleted ? '' : '<li>30분 전에 키네틱 에이펙스 간부진 봄<span>오늘</span></li>') +
      '<li>QS 신규 공정 라인 야간 가동 3주째<span>어제</span></li>' +
      '<li>KA vs QS 특허 소송 2차 변론 요약<span>2일 전</span></li>' +
      '<li>QS가 외계인 고문한다는 말 어디서 나왔는지 앎<span>3일 전</span></li>' +
      '<li>협력사 단가 또 깎임. 독종 맞음<span>4일 전</span></li></ul>';
  }

  function renderThread() {
    if (deleted) {
      thread.innerHTML = '<div class="gone"><b>삭제된 게시물입니다.</b>요청하신 게시물(48213)이 존재하지 않습니다.</div>';
      return;
    }
    thread.innerHTML =
      '<div class="post">' +
        '<h1>30분 전에 키네틱 에이펙스 간부진 봄</h1>' +
        '<div class="meta"><span>#48213</span><button class="who" id="who" type="button" aria-expanded="false">등대지기</button><span>' + hms(at(0)) + '</span><span>조회 <span id="views">1</span></span></div>' +
        '<div class="profile" id="profile"></div>' +
        '<div class="body">' +
          '<p>방금 퇴근길에 봤음. 30분 전.</p>' +
          '<p>검은 차 세 대가 와서 서더니 키네틱 에이펙스 임원들이 내림. 전무급 둘은 확실함. IR 영상에서 얼굴 몇 번 봤던 사람들임.</p>' +
          '<p>같이 내린 정장들은 사원증이 없었음. 그리고 들어간 건물이 키네틱 쪽 건물이 아님.</p>' +
          '<p>사진은 흔들렸는데 일단 올림.</p>' +
          '<div class="photo"><canvas id="ph" width="1040" height="585" aria-label="흔들린 야간 사진"></canvas><div class="cap">IMG_0931.jpg · 1.2MB</div></div>' +
        '</div>' +
        '<div class="sig">QS 협력사 3년차. 외계인 고문 현장 증언 가능.</div>' +
      '</div>' +
      '<div class="replies" id="replies"></div>' +
      '<div class="write"><input id="cmt" type="text" placeholder="댓글을 쓰려면 평판 +50 이상이 필요합니다." disabled><button type="button" disabled>등록</button></div>';

    var who = document.getElementById("who"), prof = document.getElementById("profile");
    who.addEventListener("click", function () {
      var open = prof.classList.toggle("open");
      who.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) prof.innerHTML = profileHTML();
    });
    drawPhoto(document.getElementById("ph"));
  }

  function renderReplies(animateFrom) {
    var box = document.getElementById("replies");
    if (!box) return;
    var e = elapsed(), html = "", count = 0;
    replies.forEach(function (r, i) {
      if (r.t <= e) {
        count++;
        html += '<div class="reply' + (r.op ? ' op' : '') + (i >= animateFrom ? ' fresh' : '') + '"><div class="rh"><b>' + r.w + '</b><span>' + hms(at(r.t)) + '</span></div><div>' + r.m + '</div></div>';
      }
    });
    box.innerHTML = html || '<div class="noreply">아직 댓글이 없습니다.</div>';
    return count;
  }

  function drawPhoto(c) {
    var x = c.getContext("2d"), W = c.width, H = c.height;
    x.fillStyle = "#07080a"; x.fillRect(0, 0, W, H);
    x.filter = "blur(6px)";
    // building
    x.fillStyle = "#14181d"; x.fillRect(360, 40, 560, 380);
    for (var r = 0; r < 7; r++) for (var k = 0; k < 9; k++) {
      if ((r * 7 + k * 3) % 5 === 0) continue;
      x.fillStyle = (r + k) % 4 ? "rgba(170,190,210,.25)" : "rgba(230,220,180,.55)";
      x.fillRect(390 + k * 58, 70 + r * 48, 34, 22);
    }
    // street light glow
    var g = x.createRadialGradient(180, 120, 5, 180, 120, 160);
    g.addColorStop(0, "rgba(255,210,140,.8)"); g.addColorStop(1, "rgba(255,210,140,0)");
    x.fillStyle = g; x.fillRect(0, 0, 400, 320);
    // road
    x.fillStyle = "#0d0f12"; x.fillRect(0, 420, W, H - 420);
    // three cars
    [[120, 430], [400, 438], [680, 434]].forEach(function (p) {
      x.fillStyle = "#020203"; x.fillRect(p[0], p[1], 230, 70); x.fillRect(p[0] + 40, p[1] - 34, 140, 40);
      x.fillStyle = "rgba(255,60,40,.6)"; x.fillRect(p[0] + 4, p[1] + 26, 18, 8); x.fillRect(p[0] + 208, p[1] + 26, 18, 8);
    });
    // figures
    x.fillStyle = "#000";
    [560, 600, 640, 700, 735].forEach(function (fx, i) {
      x.fillRect(fx, 330 + (i % 2) * 6, 26, 96); x.beginPath(); x.arc(fx + 13, 318 + (i % 2) * 6, 14, 0, 7); x.fill();
    });
    x.filter = "none";
    // motion smear
    x.globalAlpha = .35; x.drawImage(c, 14, 4); x.drawImage(c, -10, -3); x.globalAlpha = 1;
    // noise
    var d = x.getImageData(0, 0, W, H), a = d.data;
    for (var i = 0; i < a.length; i += 4) { var n = (Math.random() - .5) * 38; a[i] += n; a[i + 1] += n; a[i + 2] += n; }
    x.putImageData(d, 0, 0);
    x.fillStyle = "rgba(255,170,60,.85)"; x.font = "22px monospace";
    x.fillText(hm(at(-1800)).replace(":", " : "), W - 120, H - 24);
  }

  function tick() {
    var now = new Date();
    document.getElementById("clock").textContent = hms(now);
    var e = elapsed();
    if (!deleted && e >= DURATION) {
      deleted = true;
      var live = shown > 0 || e < DURATION + 3;
      renderList(); renderThread();
      if (live) { document.body.classList.add("glitch"); setTimeout(function () { document.body.classList.remove("glitch"); }, 900); }
      return;
    }
    if (!deleted) {
      var before = shown;
      shown = renderReplies(before) ;
      if (shown !== before) renderList();
      var v = document.getElementById("views");
      if (v) v.textContent = String(1 + Math.floor(e / 4));
    }
    var on = document.getElementById("online");
    on.textContent = String(214 + Math.round(Math.sin(now / 20000) * 9));
  }

  deleted = elapsed() >= DURATION;
  renderThread();
  shown = deleted ? 0 : renderReplies(replies.length);
  renderList();
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
